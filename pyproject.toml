[project]
name = "wire-agent"
version = "0.1.0"
description = "OpenHands plugin for conversational wire harness design (connectors, wires, routes, gates, manufacturing projections)"
license = "BSD-3-Clause"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "mcp>=1.29,<2",
]

[dependency-groups]
dev = [
    "packaging>=26",
    "pyright>=1.1.414",
    "pytest>=9",
    "pytest-cov==7.1.0",
    "pytest-xdist>=3",
    "ruff>=0.16",
]
sdk-check = ["openhands-sdk==1.59.0", "openhands-tools==1.59.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wire"]

[tool.uv]
required-version = "==0.13.6"
default-groups = ["dev", "sdk-check"]
# litellm>=1.104 pins filelock<4.0, which keeps the image-publish Trivy gate
# on CVE-2026-112940. filelock's locking API is unchanged in 4.x, so the
# override is safe; drop it once litellm relaxes the cap.
override-dependencies = ["filelock>=4.2.1"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.format]
# Family-canonical files are byte-identical across repos (formatted at 88).
exclude = [
  "scripts/mutation_probe.py",
  "scripts/structural_coverage.py",
  "tests/test_mutation_probe.py",
  "tests/test_structural_coverage.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = [
    "src",
    "scripts",
    "tests",
    "plugins/wire/hooks/scripts",
    "plugins/wire/scripts",
]
exclude = ["**/__pycache__", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto --dist loadgroup"
pythonpath = ["."]

[tool.coverage.run]
source = ["src/wire"]
branch = true

[tool.vibebb-coverage]
# Ratchet floors (percent) for scripts/structural_coverage.py, measured on
# main (after VRP v2) minus one point for interpreter variance. Raise them,
# never lower.
c0 = 80
c1 = 69
decision = 62
c2 = 58
mcdc = 33
boundary = 58

[tool.vibebb-mutation]
# Advisory weekly mutation probe (scripts/mutation_probe.py); never a gate.
targets = ["src/wire/gates.py"]
tests = ["tests/test_gates.py", "tests/test_gate_boundaries.py"]
max_mutants = 400

[tool.coverage.report]
fail_under = 77
