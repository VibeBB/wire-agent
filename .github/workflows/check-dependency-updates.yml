name: Dependency update check

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --locked
      - name: Collect update candidates
        run: uv run python scripts/check_dependency_updates.py > report.json
      - name: Post report to issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > report.md
          import json
          data = json.load(open("report.json", encoding="utf-8"))
          outdated = [
              s for group in data.values() for s in group if s["outdated"]
          ]
          if not outdated:
              print("All checked dependencies are current.")
          for s in outdated:
              print(
                  f"- `{s['name']}` ({s['source']}): "
                  f"{s['current']} -> {s['latest']} {s['note']}"
              )
          PY
          issue=$(gh issue list --label dependency-updates --state open \
            --json number --jq '.[0].number' || true)
          if [ -z "$issue" ]; then
            gh issue create --title "Dependency update check report" \
              --label dependency-updates --body-file report.md
          else
            gh issue comment "$issue" --body-file report.md
          fi
