name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull_request runs are cancelled; main pushes and dispatched
  # runs are never cancelled so in-flight main verification always lands.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # No actions/cache usage: forbid restore and save entirely.
    cache-mode: none
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ] || [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          if grep -Ev '^(docs/|[^/]+\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/|\.github/PULL_REQUEST_TEMPLATE\.md$)' "$RUNNER_TEMP/changed-files" >/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          # The matrix legs save uv caches concurrently; a distinct suffix
          # per leg avoids "Unable to reserve cache" races.
          cache-suffix: verify-${{ matrix.python-version }}
      - name: Sync dependencies
        id: sync
        run: uv sync --locked
      - name: Verify fast stage
        id: fast
        run: uv run python scripts/verify_all.py --stage fast

  # Forward-compatibility canary ahead of the next stable release. Runs
  # sequentially: a tolerated step failure inside a background leg can end
  # the run as failure even when every job is green (observed on main),
  # so the canary keeps ordinary steps plus per-step continue-on-error
  # and reports failures as an annotation instead.
  canary:
    name: verify (3.15)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # The canary leg builds sdists (e.g. fastuuid's pinned PyO3)
      # against a pre-release CPython; abi3 forward-compat mode lets
      # the wheel target the stable ABI instead of refusing at build
      # time.
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.15"
          # The matrix legs save uv caches concurrently; a distinct suffix
          # per leg avoids "Unable to reserve cache" races.
          cache-suffix: verify-3.15
          # The canary's uv sync always fails while deps lack 3.15
          # wheels; a cache would only rewrite half-built sdists
          # against the repo's 10 GB cache budget.
          enable-cache: false
      - name: Sync dependencies
        id: sync
        continue-on-error: true
        run: uv sync --locked
      - name: Verify fast stage
        id: fast
        continue-on-error: true
        run: uv run python scripts/verify_all.py --stage fast
      - name: Report 3.15 canary outcome
        if: always() && (steps.sync.outcome == 'failure' || steps.fast.outcome == 'failure')
        run: |
          echo "::warning::Python 3.15 canary leg failed (sync=${{ steps.sync.outcome }}, verify=${{ steps.fast.outcome }}) — forward-compat signal, not a gate failure"

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: e2e
      - name: Sync dependencies
        run: uv sync --locked
      # Two independent in-image checks; each writes a disjoint output
      # path, so they run as a parallel group (implicit wait at the end).
      - parallel:
          - name: Author example harness end to end (inside locked image)
            run: |
              uv run python scripts/run_in_locked_image.py -- \
                python scripts/e2e_authoring.py \
                --contract examples/sensor-harness/sensor-harness.contract.json \
                --out out/ci/sensor-harness
          - name: drawio export check (inside locked image)
            run: |
              uv run python scripts/run_in_locked_image.py -- \
                python scripts/check_drawio_export.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wire-sensor-harness
          path: out/ci
          retention-days: 14

  dockerfile-lint:
    needs: changes
    # Hadolint and BuildKit --check read only docker/**; docs-only pull
    # requests cannot produce findings, so skip like e2e.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # No actions/cache usage: forbid restore and save entirely.
    cache-mode: none
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Hadolint is read-only on docker/**: overlap it with the BuildKit
      # setup + --check and join it before the job ends.
      - name: Lint Dockerfiles with hadolint
        id: hadolint
        background: true
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/wire-tools.Dockerfile
          recursive: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Run BuildKit checks
        run: docker build --check -f docker/wire-tools.Dockerfile .
      - name: Wait for hadolint
        wait: hadolint

  plugin-load:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: plugin-load
      - name: Sync dependencies
        run: uv sync --locked --group sdk-check
      - name: Check plugin loads via SDK
        run: uv run --group sdk-check python scripts/check_plugin_load.py
