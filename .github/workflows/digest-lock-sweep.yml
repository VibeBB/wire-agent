name: Digest lock PR sweep

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digest-lock-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      # Dispatches the post-merge workflows on main; bot merges do not
      # fire push events.
      actions: write
      contents: write # merges and deletes digest-lock branches
      pull-requests: write # merges stalled digest-lock PRs
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          # This job only talks to the GitHub API; block everything else.
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Merge stalled digest-lock PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep in sync with the post-merge dispatch list in
          # publish-wire-images.yml (publish_image_pin_pr.sh arg 4).
          SWEEP_POST_MERGE_WORKFLOWS: "ci.yml locked-image-check.yml workflow-lint.yml"
        run: bash scripts/digest_lock_sweep.sh
