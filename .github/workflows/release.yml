name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/scripts/validate_release.sh"
      - ".github/workflows/release*.yml"
      - ".github/workflows/publish-wire-images.yml"
      - ".github/workflows/locked-image-check.yml"
      - "scripts/bump_version.py"
      - "scripts/*release*.py"
      - "tests/test_bump_version.py"
      - "tests/test_release*.py"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
      - run: shellcheck .github/scripts/validate_release.sh
      - run: uv run --locked pytest -n 0 tests/test_release_policy.py tests/test_bump_version.py

  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      source: ${{ steps.release.outputs.source }}
      image: ${{ steps.release.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, version, and candidate image origin
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/validate_release.sh

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] same-repo reuse
    with:
      ref: ${{ needs.validate.outputs.sha }}

  install-smoke:
    needs: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          cache-suffix: release-install-smoke
      - name: Sync dependencies
        run: uv sync --locked --group sdk-check
      - name: Smoke-test remote install
        env:
          REF: ${{ needs.validate.outputs.sha }}
        run: >
          uv run --group sdk-check python scripts/smoke_install_plugin.py
          --repo VibeBB/wire-agent --ref "$REF" --repo-path plugins/wire

  build:
    needs: [validate, verify, install-smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          cache-suffix: release
      - name: Sync dependencies
        run: uv sync --locked
      - name: Stage the verified candidate lock
        env:
          CANDIDATE_SOURCE: ${{ needs.validate.outputs.source }}
          IMAGE: ${{ needs.validate.outputs.image }}
        run: python3 -m scripts.validate_release_candidate --write-locks .
      - name: Author example harness
        run: |
          mkdir -p dist/samples
          # drawio-desktop + xvfb only exist inside the pinned wire-tools
          # image, so authoring runs in the locked container (same path as
          # locked-image-check) with the checkout bind-mounted.
          python3 scripts/run_in_locked_image.py -- python3 scripts/e2e_authoring.py \
            --contract examples/sensor-harness/sensor-harness.contract.json \
            --out dist/samples/sensor-harness
      - name: Build release zips
        run: |
          (cd plugins && zip -r "../dist/wire-plugin-v${VERSION}.zip" wire)
          zip -r "dist/wire-samples-v${VERSION}.zip" dist/samples
          (cd dist && sha256sum wire-*.zip > checksums-sha256.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wire-release-${{ github.run_id }}
          path: |
            dist/wire-*.zip
            dist/checksums-sha256.txt
          if-no-files-found: error
          retention-days: 35
          overwrite: true

  publish:
    needs: [validate, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
      packages: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck policy, candidate, and Release availability
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SOURCE: ${{ needs.validate.outputs.source }}
          IMAGE: ${{ needs.validate.outputs.image }}
        run: bash .github/scripts/validate_release.sh --publish-check
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wire-release-${{ github.run_id }}
          path: dist
          digest-mismatch: error
      - name: Verify release ZIPs
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          CANDIDATE_SOURCE: ${{ needs.validate.outputs.source }}
          IMAGE: ${{ needs.validate.outputs.image }}
        run: |
          (cd dist && sha256sum --strict --check checksums-sha256.txt)
          expected=$(mktemp -d)
          python3 -m scripts.validate_release_candidate --write-locks "$expected"
          unzip -p "dist/wire-plugin-v${VERSION}.zip" wire/skills/wire-workflow/tools-image.json \
            | cmp - "$expected/plugins/wire/skills/wire-workflow/tools-image.json"
      - name: Promote the verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.validate.outputs.image }}
        run: |
          digest=${IMAGE##*@}
          inspect() {
            docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}'
          }
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          package=${IMAGE%@*}
          docker buildx imagetools create --prefer-index=false \
            --tag "$package:$GITHUB_REF_NAME" --tag "$package:latest" "$IMAGE"
          test "$(inspect "$package:$GITHUB_REF_NAME")" = "$digest"
          test "$(inspect "$package:latest")" = "$digest"
      - name: Publish GitHub Release for the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "wire $GITHUB_REF_NAME" dist/wire-*.zip dist/checksums-sha256.txt
