name: Locked image check

on:
  push:
    branches: [main]
  schedule:
    - cron: "40 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: locked-image-check
  cancel-in-progress: false

jobs:
  check-lock:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      present: ${{ steps.lock.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lock
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          lock = json.loads(Path("docker/image-digests.json").read_text(encoding="utf-8"))
          if not isinstance(lock, dict):
              raise SystemExit("image lock must be a JSON object")
          entry = lock.get("wire_tools")
          if not isinstance(entry, dict):
              raise SystemExit("image lock must contain a wire_tools object")
          if entry.get("image") != "ghcr.io/vibebb/wire-tools":
              raise SystemExit("wire_tools image does not match ghcr.io/vibebb/wire-tools")
          if "digest" not in entry or "tag" not in entry:
              raise SystemExit("wire_tools lock must contain digest and tag fields")
          digest = entry["digest"]
          tag = entry["tag"]
          if digest is None and tag is None:
              present = "false"
          else:
              if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
                  raise SystemExit("wire_tools digest must be null or a sha256 digest")
              if not isinstance(tag, str) or re.fullmatch(r"[0-9a-f]{40}-tools", tag) is None:
                  raise SystemExit("wire_tools tag must be null or a 40-character tools tag")
              present = "true"
          Path(os.environ["GITHUB_OUTPUT"]).write_text(
              f"present={present}\n", encoding="utf-8"
          )
          PY
  check:
    needs: check-lock
    if: needs.check-lock.outputs.present == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          cache-suffix: locked-image-check
      - run: uv sync --locked
      - run: uv run python scripts/pull_locked_image.py --entry wire_tools
      - id: image
        run: echo "ref=$(uv run python scripts/print_locked_image.py --entry wire_tools)" >> "$GITHUB_OUTPUT"
      - name: Prepare smoke output
        run: |
          mkdir -p "$RUNNER_TEMP/wire-smoke"
          chmod 0777 "$RUNNER_TEMP/wire-smoke"
      # e2e_authoring exits non-zero unless the gate verdict is "pass"
      # (fail-closed), so the container exit code is the smoke check. The
      # output dir stays inside the container's world-writable /tmp.
      - name: Smoke locked image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          docker run --rm --user wire \
            --volume "$RUNNER_TEMP/wire-smoke:/tmp/wire-smoke" "$IMAGE_REF" \
            python /opt/wire/scripts/e2e_authoring.py \
              --contract /opt/wire/examples/sensor-harness/sensor-harness.contract.json \
              --out /tmp/wire-smoke/sensor-harness
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: locked-wire-tools-smoke
          path: |
            ${{ runner.temp }}/wire-smoke/**/design-report.json
            ${{ runner.temp }}/wire-smoke/**/design-report.md
          if-no-files-found: ignore
