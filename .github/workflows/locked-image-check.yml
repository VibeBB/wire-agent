name: Locked image check

on:
  push:
    branches: [main]
  schedule:
    - cron: "40 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

concurrency:
  group: locked-image-check
  cancel-in-progress: false

jobs:
  check-lock:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      present: ${{ steps.lock.outputs.present }}
      image: ${{ steps.lock.outputs.image }}
      digest: ${{ steps.lock.outputs.digest }}
      attestation: ${{ steps.lock.outputs.attestation }}
      sbom_attestation: ${{ steps.lock.outputs.sbom_attestation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lock
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          lock = json.loads(Path("docker/image-digests.json").read_text(encoding="utf-8"))
          if not isinstance(lock, dict):
              raise SystemExit("image lock must be a JSON object")
          entry = lock.get("wire_tools")
          if not isinstance(entry, dict):
              raise SystemExit("image lock must contain a wire_tools object")
          if entry.get("image") != "ghcr.io/vibebb/wire-tools":
              raise SystemExit("wire_tools image does not match ghcr.io/vibebb/wire-tools")
          if "digest" not in entry or "tag" not in entry:
              raise SystemExit("wire_tools lock must contain digest and tag fields")
          digest = entry["digest"]
          tag = entry["tag"]
          if digest is None and tag is None:
              if entry.get("attestation") is not None:
                  raise SystemExit("wire_tools attestation cannot exist without a pinned image")
              if entry.get("sbom_attestation") is not None:
                  raise SystemExit("wire_tools SBOM attestation cannot exist without a pinned image")
              present = "false"
              attestation = ""
              sbom_attestation = ""
          else:
              if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
                  raise SystemExit("wire_tools digest must be null or a sha256 digest")
              if not isinstance(tag, str) or re.fullmatch(r"[0-9a-f]{40}-tools", tag) is None:
                  raise SystemExit("wire_tools tag must be null or a 40-character tools tag")
              present = "true"
              attestation = entry.get("attestation")
              if attestation is None:
                  attestation = ""
              else:
                  if not isinstance(attestation, str) or not attestation.startswith("https://"):
                      raise SystemExit("wire_tools attestation must be an HTTPS URL")
              sbom_attestation = entry.get("sbom_attestation")
              if sbom_attestation is None:
                  sbom_attestation = ""
              elif not isinstance(sbom_attestation, str) or not sbom_attestation.startswith("https://"):
                  raise SystemExit("wire_tools SBOM attestation must be an HTTPS URL")
              image = entry["image"]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"present={present}\n")
              output.write(f"image={image if present == 'true' else ''}\n")
              output.write(f"digest={digest if present == 'true' else ''}\n")
              output.write(f"attestation={attestation}\n")
              output.write(f"sbom_attestation={sbom_attestation}\n")
          PY
  check:
    needs: check-lock
    if: needs.check-lock.outputs.present == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          cache-suffix: locked-image-check
      - run: uv sync --locked
      - name: Warn that tools image has no attestation metadata
        if: needs.check-lock.outputs.attestation == ''
        run: echo "::warning::wire_tools image lock has no attestation metadata; skipping provenance verification."
      - name: Verify tools image provenance
        if: needs.check-lock.outputs.attestation != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.check-lock.outputs.image }}
          DIGEST: ${{ needs.check-lock.outputs.digest }}
        run: |
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-wire-images.yml"
      - name: Warn that tools image has no SBOM attestation metadata
        if: needs.check-lock.outputs.sbom_attestation == ''
        run: echo "::warning::wire_tools image lock has no SBOM attestation metadata; skipping SBOM verification."
      - name: Verify tools image SBOM attestation
        if: needs.check-lock.outputs.sbom_attestation != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.check-lock.outputs.image }}
          DIGEST: ${{ needs.check-lock.outputs.digest }}
        run: |
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-wire-images.yml" \
            --predicate-type https://spdx.dev/Document/v2.3
      - run: uv run python scripts/pull_locked_image.py --entry wire_tools
      - id: image
        run: echo "ref=$(uv run python scripts/print_locked_image.py --entry wire_tools)" >> "$GITHUB_OUTPUT"
      - name: Prepare smoke output
        run: |
          mkdir -p "$RUNNER_TEMP/wire-smoke"
          chmod 0777 "$RUNNER_TEMP/wire-smoke"
      # e2e_authoring exits non-zero unless the gate verdict is "pass"
      # (fail-closed), so the container exit code is the smoke check. The
      # output dir stays inside the container's world-writable /tmp.
      - name: Smoke locked image
        env:
          GH_TOKEN: ${{ github.token }}
          OPENHANDS_PROJECT_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          launcher=plugins/wire/scripts/wire_launcher.py
          out=.round2-smoke/wire
          mkdir -p "$out"
          if python3 - <<'PY'
          import json
          from pathlib import Path

          entry = json.loads(Path("docker/image-digests.json").read_text(encoding="utf-8"))["wire_tools"]
          raise SystemExit(0 if entry.get("attestation") else 1)
          PY
          then
            export WIRE_VERIFY_ATTESTATION=require
          else
            export WIRE_VERIFY_ATTESTATION=auto
          fi
          python3 "$launcher" prewarm
          python3 "$launcher" doctor > "$out/doctor.json"
          set +e
          python3 "$launcher" author \
            --contract examples/sensor-harness/sensor-harness.contract.json \
            --out "$out/sensor-harness" > "$out/author.stdout.json"
          status=$?
          set -e
          python3 - "$out/sensor-harness" "$out/author.stdout.json" "$status" <<'PY'
          import json
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          stdout = Path(sys.argv[2])
          status = int(sys.argv[3])
          reports = sorted(output.rglob("*report.json"))
          printed = False
          for report_path in reports:
              report = json.loads(report_path.read_text(encoding="utf-8"))
              if isinstance(report, dict) and "checks" in report:
                  print(json.dumps(report["checks"], ensure_ascii=False, indent=2))
                  printed = True
          if not printed:
              print(stdout.read_text(encoding="utf-8"))
          result = json.loads(stdout.read_text(encoding="utf-8"))
          if status != 0 or result.get("verdict") != "pass":
              raise SystemExit("wire launcher smoke did not pass")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: locked-wire-tools-smoke
          path: |
            ${{ github.workspace }}/.round2-smoke/wire/**/design-report.json
            ${{ github.workspace }}/.round2-smoke/wire/**/design-report.md
          if-no-files-found: ignore
